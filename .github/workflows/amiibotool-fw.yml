name: amiibotool-fw

on:
  push:
    branches: ["amiibotool"]
    tags: ["2.16.*", "v2.16.*", "*-amiibotool"]
  workflow_dispatch:

concurrency:
  group: amiibotool-fw-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: solosky/nrf52-sdk:latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'
        fetch-depth: 0

    - name: Change Owner of Container Working Directory
      run: chown root:root .

    - name: Configure git for container
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Resolve firmware version
      shell: bash
      run: |
        set -eo pipefail
        if [ "${{ github.ref_type }}" = "tag" ]; then
          FW_VERSION="${{ github.ref_name }}"
          FW_VERSION="${FW_VERSION#v}"
          FW_VERSION="${FW_VERSION%-amiibotool}"
        else
          FW_VERSION="$(git describe --tags --abbrev=0 --match '2.16.*' 2>/dev/null || true)"
          FW_VERSION="${FW_VERSION#v}"
          FW_VERSION="${FW_VERSION%-amiibotool}"
          FW_VERSION="${FW_VERSION:-2.16.1}"
        fi
        IFS=. read -r major minor patch <<< "$FW_VERSION"
        APP_VERSION=$((major * 10000 + minor * 100 + patch))
        echo "FW_VERSION=$FW_VERSION" >> "$GITHUB_ENV"
        echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
        echo "Resolved firmware version: $FW_VERSION (APP_VERSION=$APP_VERSION)"

    - name: build firmware
      shell: bash
      run: |
        set -eo pipefail
        cd fw
        FW_VERSION="$FW_VERSION" make -C application version RELEASE=1 APP_VERSION="$APP_VERSION" BOARD=KEYPAD
        make -j$(nproc) bl RELEASE=1 BOARD=KEYPAD OLED_TYPE=sh1106
        make -j$(nproc) app RELEASE=1 APP_VERSION="$APP_VERSION" BOARD=KEYPAD
        make -C application full RELEASE=1 APP_VERSION="$APP_VERSION" BOARD=KEYPAD
        make -C application ota RELEASE=1 APP_VERSION="$APP_VERSION" BOARD=KEYPAD

    - name: generate size report
      run: cd fw && make size_report RELEASE=1 APP_VERSION="$APP_VERSION" BOARD=KEYPAD

    - name: verify KEYPAD FLASH budget
      shell: bash
      run: |
        set -eo pipefail
        python3 - <<'PY'
        import json
        import sys
        from pathlib import Path

        report = Path("fw/_build/size_report_KEYPAD.json")
        metrics = json.loads(report.read_text(encoding="utf-8"))
        flash_limit = 0x5B000
        flash_used = int(metrics["sections"]["text"]) + int(metrics["sections"]["data"])
        headroom = flash_limit - flash_used
        print(f"KEYPAD FLASH used: {flash_used} / {flash_limit} bytes ({headroom} headroom)")
        if flash_used > flash_limit:
            print("FLASH budget exceeded; disable optional apps or reduce firmware size.")
            sys.exit(1)
        PY

    - name: AmiiboTool build note
      run: |
        {
          echo "## AmiiboTool firmware (KEYPAD) v${FW_VERSION}"
          echo
          echo "This workflow builds **BOARD=KEYPAD** for four-button AmiiboTool/iNFC hardware (back button on P0.20)."
          echo "Download artifact **amiibotool-fw-keypad-v${FW_VERSION}** and flash **pixljs_all.hex** via wired method."
          echo "OTA package: **pixjs_ota_v${FW_VERSION}.zip** (DFU application-version ${APP_VERSION})."
          echo "Do **not** use pixljs_fw_OLED (three-button) on AmiiboTool devices."
          echo "KEYPAD build disables **Player** and **Game** to stay within FLASH limits; Amiibo apps remain enabled."
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: copy artifact
      shell: bash
      run: |
        set -eo pipefail
        mv fw/_build/bootloader.hex .
        mv fw/_build/pixljs.hex .
        mv fw/_build/pixljs_all.hex .
        mv "fw/_build/pixjs_ota_v${APP_VERSION}.zip" "./pixjs_ota_v${FW_VERSION}.zip"
        mv fw/docs/fw_readme.txt .
        mv fw/scripts/fw_update.bat .
        cp fw/_build/size_report_KEYPAD.txt .

    - name: upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: amiibotool-fw-keypad-v${{ env.FW_VERSION }}
        path: |
          bootloader.hex
          pixljs.hex
          pixljs_all.hex
          pixjs_ota_v${{ env.FW_VERSION }}.zip
          fw_readme.txt
          fw_update.bat
          size_report_KEYPAD.txt
